<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f9" />
    <meta name="author" content="Fatiha Maitland, FM Education Services" />

    <!--
      Title, description, canonical, hreflang, Open Graph, Twitter, and JSON-LD
      are managed per-route by react-helmet-async (src/components/Seo.jsx) and
      baked into each page by the prerender step (scripts/prerender.mjs). They
      are intentionally NOT declared statically here, so the prerendered HTML
      carries exactly one authoritative set per page.
    -->

    <!--
      Paints the theme before the first frame, so there is no flash of the wrong
      one. The stored value is the *preference* — "light", "dark" or "system"
      (anything else, including nothing stored, means system). Mirrors
      src/context/ThemeContext.jsx; change both together.
    -->
    <script>
      (function () {
        try {
          var key = "corporate-theme";
          var stored = localStorage.getItem(key);
          var preference =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var theme =
            preference !== "system"
              ? preference
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0a1219" : "#f4f7f9");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts are loaded off the critical path: fetch the stylesheet as a
      non-blocking resource, then flip it to `all` once it arrives. `display=swap`
      keeps text visible in the fallback face meanwhile, and <noscript> covers
      the no-JS case. Removes the render-blocking round-trip to Google Fonts.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
